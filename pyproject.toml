[project]
name = "campaign-roi-marketing-bi-warehouse"
version = "0.1.0"
description = "Synthetic Campaign ROI analytics and multi-source marketing BI warehouse."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "pydantic>=2.7",
  "requests>=2.32",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
warehouse = ["psycopg2-binary>=2.9", "dbt-core>=1.9,<1.12", "dbt-postgres>=1.9,<1.10", "dbt-duckdb>=1.9,<1.10", "duckdb>=1.1"]
cloud = [
  "dbt-core>=1.9,<1.12",
  "dbt-bigquery>=1.9,<1.10",
  "google-cloud-bigquery>=3.25",
  "google-cloud-storage>=2.18",
  "google-cloud-secret-manager>=2.20",
]
airflow = ["apache-airflow==3.3.0"]
parquet = ["pyarrow>=16.0"]
api = ["fastapi>=0.133,<0.134", "starlette>=1.3.1,<1.4", "uvicorn[standard]>=0.30,<0.33"]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]
quality = ["great_expectations>=0.18"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx2>=2.0,<3.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "sqlfluff>=3.1",
  "yamllint>=1.35",
  "detect-secrets>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"api_simulator/main.py" = ["I001"]
"bi_app/streamlit_app.py" = ["I001"]
"python_analysis/*.py" = ["I001"]
"scripts/build_demo_marts.py" = ["I001"]
"scripts/load_duckdb_raw.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false

[tool.coverage.run]
branch = true
source = ["analytics", "data_sources", "ingestion", "monitoring", "ops", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
