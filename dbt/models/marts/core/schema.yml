version: 2

models:
  - name: dim_campaign
    description: "SCD Type 2-style conformed campaign dimension."
    columns:
      - name: campaign_key
        tests: [not_null, unique]
      - name: campaign_id
        tests: [not_null]
  - name: dim_channel
    columns:
      - name: channel_key
        tests: [not_null, unique]
  - name: dim_customer
    columns:
      - name: customer_key
        tests: [not_null, unique]
  - name: fact_campaign_performance
    description: "Daily campaign performance fact with spend, impressions, clicks, platform conversions, and attributed revenue."
    columns:
      - name: fact_campaign_performance_key
        tests: [not_null, unique]
      - name: event_date
        tests: [not_null]
      - name: spend
        tests: [not_null]
  - name: fact_sessions
    columns:
      - name: session_id
        tests: [not_null, unique]
  - name: fact_conversions
    columns:
      - name: conversion_id
        tests: [not_null, unique]
  - name: fact_attribution
    columns:
      - name: fact_attribution_key
        tests: [not_null]
  - name: metricflow_time_spine
    description: "Daily time spine required by dbt Semantic Layer and MetricFlow."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests: [not_null, unique]
