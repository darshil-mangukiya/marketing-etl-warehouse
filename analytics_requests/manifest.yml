      - mart.mart_attribution_model_comparison
      - mart.mart_attribution_summary
      - mart.mart_attribution_reconciliation
  - id: REQ-05
    slug: request_05_budget_scenario
    requester: Performance Marketing Manager
    question: Which areas should be reviewed if budget needs to be reallocated?
