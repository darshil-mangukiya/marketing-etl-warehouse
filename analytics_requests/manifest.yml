    slug: request_01_roas_decline
    requester: VP Marketing
    question: Why is paid-social attributed ROAS materially below the review line?
    sources:
      - mart.mart_campaign_performance
      - mart.mart_campaign_action_center
      - mart.mart_data_quality_monitoring
  - id: REQ-02
