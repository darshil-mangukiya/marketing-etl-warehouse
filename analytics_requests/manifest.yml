  - id: REQ-06
    slug: request_06_data_quality_investigation
    requester: Marketing Analytics Manager
    question: Can campaign recommendations be trusted or should actions be held?
    sources:
      - mart.mart_data_quality_monitoring
      - mart.mart_campaign_action_center
