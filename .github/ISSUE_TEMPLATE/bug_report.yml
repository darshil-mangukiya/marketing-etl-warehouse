name: Bug report
description: Report a reproducible defect in ingestion, modeling, dashboarding, or release artifacts.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion
        - Data quality
        - Airflow
        - dbt
        - Warehouse
        - Dashboard
        - Semantic layer
        - Governance
        - Docker/local setup
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, input profile, and any relevant logs.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version, dbt version, and any local configuration that matters.
    validations:
      required: false
