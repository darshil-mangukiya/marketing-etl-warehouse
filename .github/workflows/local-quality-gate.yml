name: Local Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-gate:
    name: Python, marts, governance, and dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "dbt-core>=1.9,<1.12" "dbt-postgres>=1.9,<1.10" "ruff>=0.5" "yamllint>=1.35"

      - name: Static checks
        run: |
          ruff check .
          yamllint -c .yamllint.yml .

      - name: Compile Python
        run: python -m compileall -q .

      - name: Cloud and connector unit tests (no credentials)
        run: python -m pytest -q tests/test_cloud_platform.py tests/test_marketing_connectors.py tests/test_ga4_events.py

      - name: Run local quality gate
        run: python -B local_ci/local_quality_gate.py

      - name: Build and test DuckDB dbt target
        run: |
          python -B scripts/load_duckdb_raw.py
          dbt build --project-dir dbt --profiles-dir dbt --target duckdb

      - name: Documentation and patch hygiene
        run: |
          test -f docs/setup_guide.md
          test -f docs/cloud_architecture.md
          test -f docs/runbook.md
          git diff --check

      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-platform-evidence
          path: |
            data/exports/demo_mart_manifest.json
            local_ci/latest_quality_gate.json
            reports/generated/*.html
            reports/generated/*.md
            governance/generated/*
            metadata/generated/*
            catalog/generated/*
            monitoring/generated/*
